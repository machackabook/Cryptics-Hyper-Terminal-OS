name: Golden Forge ADAM Discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: golden-forge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical worker and workflow names
        run: node scripts/adam-naming-contract.mjs
      - name: Generate source-to-agent discovery inventory
        run: node scripts/golden-forge.mjs
      - name: Verify discovery artifacts
        run: |
          node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('reports/golden-forge/agent-inventory.json'));if(!x.count||x.count!==x.agents.length||x.agents.some(a=>a.verifiedRuntime))process.exit(1)"
      - name: Upload ADAM evidence
        uses: actions/upload-artifact@v4
        with:
          name: golden-forge-discovery-${{ github.run_id }}
          path: reports/golden-forge/
          if-no-files-found: error
          retention-days: 30
