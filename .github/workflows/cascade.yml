name: cascade-enhance
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  nexus-react-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate repository and build
        run: |
          set -euo pipefail
          test -f README.md && test -f SECURITY.md
          test -f docs/LEDGER-STAMP.md
          node --check scripts/verify.mjs
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
      - name: Run repository security checks
        run: |
          set -euo pipefail
          node --test tests/security.test.mjs tests/public-surface.test.mjs
          node scripts/verify.mjs
