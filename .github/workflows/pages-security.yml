name: Cryptic Pages Sentinel Security
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: cryptic-react-security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  react-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm tracked source and scripts
        run: |
          set -euo pipefail
          git diff --check
          test -f package.json && test -f tsconfig.json && test -f index.html
          node --check scripts/verify.mjs
          node --check scripts/pages-security-audit.mjs
      - name: Install React dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, build and relevant security tests
        run: |
          set -euo pipefail
          npm run lint
          npm run build
          test -s dist/index.html
          node --test tests/react-runtime-contract.test.mjs
          node scripts/verify.mjs
          node scripts/pages-security-audit.mjs --local-only
      - name: Save non-secret build receipt
        if: always()
        run: |
          mkdir -p reports/security
          printf 'repository=%s\ncommit=%s\nrun=%s\njob=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "${{ job.status }}" > reports/security/ci-receipt.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: nexus-react-security-${{ github.run_id }}, path: reports/security/ci-receipt.txt, retention-days: 14}
